intro: Photos from travels and everyday life.

# Categories drive the filter buttons on /photography/.
# The `slug` is what each album references as `category:`.
categories:

  - slug: portraits
    name: portraits
    description: 人像 — people, posed and candid.

  - slug: travel
    name: travel
    description: From the road.

  - slug: street
    name: street
    description: Found moments.

  - slug: everyday
    name: everyday
    description: The ordinary stuff.


# ---------------------------------------------------------------------------
# Albums. Empty for now so the page shows its "under construction" state
# rather than a grid of broken image icons.
#
# Each album renders as a cover image + a thumbnail grid; clicking any
# thumbnail opens the lightbox (arrow keys / Esc to navigate).
#
# IMPORTANT: image paths must start with a leading "/" so they resolve from
# /photography/ — a bare "assets/..." would 404 there.
#
# Suggested layout on disk:
#   assets/img/photos/<album-slug>/cover.jpg
#   assets/img/photos/<album-slug>/01.jpg, 02.jpg, ...
#
# Uncomment and edit to publish your first album:
#
# albums:
#   - title: "Album Title"
#     category: portraits          # must match a slug above
#     date: "Month Year"
#     location: "City, Country"
#     tags: [35mm]
#     cover: /assets/img/photos/album-slug/cover.jpg
#     description: "A sentence or two about this set."
#     photos:
#       - src: /assets/img/photos/album-slug/01.jpg
#         caption: "Optional caption."
#       - src: /assets/img/photos/album-slug/02.jpg
#         caption:
# ---------------------------------------------------------------------------

albums:
