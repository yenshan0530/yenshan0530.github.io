# about me paragraphs
# DRAFT — assembled from your CV. Please rewrite in your own voice; I have kept
# it to things the CV states outright rather than inventing any framing.
first-paragraph: >-
  I am an M.S. student in Computer Science and Information Engineering at
  <b>National Taiwan University</b>, where I work in the Machine Intelligence and
  Understanding Lab with Prof. Yun-Nung Chen. I am also a Data Scientist at
  <b>CyCraft Technology</b>. I finished my B.S. at NTU in CSIE with a double major
  in Economics.

second-paragraph: >-
  I work on the safety and robustness of large language models — how they fail,
  how to measure those failures honestly, and how to attack the systems we build
  on top of them. Previously I spent a summer at <b>Caltech</b> with Prof. Colin
  Camerer studying rational inattention through eye-tracking, and interned on the
  <b>Google</b> Pixel Camera team, where my work fed into the Guided Frame feature.

