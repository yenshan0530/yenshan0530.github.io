title: LilyNaCl3
info: Yen-Shan (Lily) Chen — CS & Economics @ NTU

# Live site. This is a GitHub Pages *user* site (repo yenshan0530.github.io),
# so it serves from the domain root and baseurl stays empty.
url: https://yenshan0530.github.io
baseurl: ""

# Build future-dated documents. Required for upcoming trips (Interspeech, COLM):
# without this Jekyll silently skips them and the map links 404.
future: true
icon-pic: /assets/favicon.svg

# Collections: one Markdown file per trip / per piece of writing.
#   _trips/kyoto.md    -> /travel/kyoto/
#   _writing/essay.md  -> /writing/essay/
collections:
  trips:
    output: true
    permalink: /travel/:name/
  writing:
    output: true
    permalink: /writing/:name/

defaults:
  - scope:
      path: ""
      type: trips
    values:
      layout: trip
  - scope:
      path: ""
      type: writing
    values:
      layout: post

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - TODO.md
  - environment.yml
  # Source PDFs for the paper figures. Kept in the repo, but not published —
  # the converted SVG/PNG in assets/img/papers/ is what the site serves.
  - assets/paper-figures
